<script>
// Anti-DevTools Script
document.addEventListener('contextmenu', event => event.preventDefault());
document.onkeydown = function (e) {
    if (e.keyCode == 123) return false;
    if (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74 || e.keyCode == 67)) return false;
    if (e.ctrlKey && (e.keyCode == 85)) { window.location.href = "error.html"; return false; }
};
(function blockDevTools() {
    try {
        var startTime = new Date().getTime();
        debugger;
        var endTime = new Date().getTime();
        if (endTime - startTime > 100) { window.location.href = 'error.html'; }
        setTimeout(blockDevTools, 500);
    } catch (e) {}
})();
</script>

<script>
// UI/Utility Script (Removed Key Logic)
lucide.createIcons();

window.showToast = function(message, type = 'info') {
    const toast = document.getElementById('custom-toast');
    const toastMsg = document.getElementById('toast-msg');
    const toastIcon = document.getElementById('toast-icon');
    const toastIconContainer = document.getElementById('toast-icon-container');
    
    toastMsg.innerText = message;
    
    if (type === 'error') { 
        toastIconContainer.className = "w-8 h-8 rounded-lg flex items-center justify-center bg-red-500/10 text-themeRed border border-red-500/20"; 
        toastIcon.setAttribute('data-lucide', 'alert-triangle'); 
    } else if (type === 'success') { 
        toastIconContainer.className = "w-8 h-8 rounded-lg flex items-center justify-center bg-themeGreen/10 text-themeGreen border border-themeGreen/20"; 
        toastIcon.setAttribute('data-lucide', 'check-circle'); 
    } else { 
        toastIconContainer.className = "w-8 h-8 rounded-lg flex items-center justify-center bg-themeBlue/10 text-themeBlue border border-themeBlue/20"; 
        toastIcon.setAttribute('data-lucide', 'bell'); 
    }
    
    lucide.createIcons({root: toastIconContainer});
    
    toast.classList.remove('opacity-0', 'translate-y-[-100px]', 'pointer-events-none');
    toast.classList.add('opacity-100', 'translate-y-0');
    
    setTimeout(() => { 
        toast.classList.add('opacity-0', 'translate-y-[-100px]', 'pointer-events-none'); 
        toast.classList.remove('opacity-100', 'translate-y-0'); 
    }, 3000);
};

// Start logic immediately on load (Auth Guard is gone)
document.addEventListener('DOMContentLoaded', () => {
    if(typeof window.startPlayerLogic === 'function') {
        window.startPlayerLogic();
    }
});
</script>

<script type="module" id="app-logic">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-analytics.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

const firebaseConfig = { apiKey:"AIzaSyDzofhvQGWmgJAZbHGUVn96dITkrPPlu8Q", authDomain:"stechshope.firebaseapp.com", projectId:"stechshope", storageBucket:"stechshope.firebasestorage.app", messagingSenderId:"36268384431", appId:"1:36268384431:web:629dc783a1d427237b745a", measurementId:"G-WRRR9XRVH8" };
const app = initializeApp(firebaseConfig, "mainApp");
const analytics = getAnalytics(app);
const db = getFirestore(app);

const API_ENDPOINT = "https://smex.dream-neet100.workers.dev";
const urlParams = new URLSearchParams(window.location.search);
const COURSE_ID = urlParams.get('courseId') || urlParams.get('id');
const CONTENT_ID = urlParams.get('contentId');

window.playerInstance = null; 
window.hlsInstance = null; 
window.shakaInstance = null;

window.goBack = function() { 
    if (COURSE_ID) { window.location.href = `content.html?id=${COURSE_ID}`; } 
    else { window.location.href = 'index.html'; } 
};

function showState(stateId) {
    ['resolver-overlay', 'fallback-state', 'player-container'].forEach(id => {
        const el = document.getElementById(id);
        if (id === stateId) { el.classList.remove('hidden'); el.classList.add('flex'); }
        else { el.classList.add('hidden'); el.classList.remove('flex'); }
    });
}

window.startPlayerLogic = function() {
    if (!COURSE_ID || !CONTENT_ID) { 
        window.showToast("Course ID or Content ID is missing in the URL!", 'error'); 
        setTimeout(window.goBack, 3000); 
        return; 
    }
    document.getElementById('loader-text').innerText = "Fetching Media Content...";
    showState('resolver-overlay');
    resolveAndPlay();
};

window.deepFindUrl = function(obj) {
    if (!obj) return null;
    const commonKeys = ['file_url', 'url', 'link', 'pdf_link', 'videoUrl', 'aws_url', 'pdf_url'];
    for (const key of commonKeys) { 
        if (obj[key] && typeof obj[key] === 'string' && obj[key].length > 5) { return obj[key]; } 
    }
    if (typeof obj === 'object') { 
        for (const key in obj) { 
            if (typeof obj[key] === 'object') { 
                const found = window.deepFindUrl(obj[key]); 
                if (found) return found; 
            } 
        } 
    }
    return null;
};

window.showFallbackState = function(message, iconName, title, actionText, targetUrl) {
    showState('fallback-state');
    const fallbackEl = document.getElementById('fallback-state');
    const iconEl = document.getElementById('fallback-icon');
    document.getElementById('fallback-message').innerText = message;
    document.getElementById('fallback-title').innerText = title;
    document.getElementById('fallback-action-text').innerText = actionText;
    document.getElementById('fallback-action-btn').onclick = function() { window.location.href = targetUrl; };
    try {
        iconEl.setAttribute('data-lucide', (iconName === 'youtube' || iconName === 'file-text') ? iconName : 'external-link');
        lucide.createIcons({root: fallbackEl});
    } catch(e) {}
};

async function resolveAndPlay() {
    try {
        // 🔥 REMOVED KEY & DEVICE ID LOGIC HERE 🔥
        const fetchUrl = `${API_ENDPOINT}?content_id=${CONTENT_ID}&course_id=${COURSE_ID}`;
        
        const response = await fetch(fetchUrl, { method: "GET" });
        if (!response.ok) {
            let errorMsg = "Failed to fetch content.";
            try { const errData = await response.json(); if(errData.reason) errorMsg = errData.reason; } catch(e) {}
            window.showToast(errorMsg, 'error');
            setTimeout(() => { goBack(); }, 2000); 
            return;
        }
        
        const result = await response.json();
        const mediaData = result.decryptedData || result.data || {};
        
        const hasDrmDetails = result.drm_details && result.drm_details.status === true && result.drm_details.data && result.drm_details.data.link && result.drm_details.data.link.file_url;
        const finalUrl = hasDrmDetails ? result.drm_details.data.link.file_url : (mediaData.file_url || window.deepFindUrl(mediaData));
        const drmToken = hasDrmDetails ? result.drm_details.data.link.token : null;
        
        if (!finalUrl || finalUrl === "") { window.showToast("Media not found.", 'error'); setTimeout(goBack, 1500); return; }
        
        const lowerUrl = finalUrl.toLowerCase();
        const title = mediaData.title || "Premium Video";
        const isLive = mediaData.is_live === 1;
        const isPdf = mediaData.file_type === 1 || lowerUrl.includes('.pdf');
        const isYouTube = mediaData.video_type === 1 || lowerUrl.includes('youtube.com') || lowerUrl.includes('youtu.be') || (!lowerUrl.startsWith('http') && finalUrl !== '');
        
        try {
            const dbDocRef = doc(db, "Courses", COURSE_ID, "contents", CONTENT_ID);
            await setDoc(dbDocRef, { course_id: COURSE_ID, content_id: CONTENT_ID, title: title, file_url: finalUrl, thumbnail: mediaData.thumbnail || "", duration: mediaData.duration || "0", is_live: isLive, file_type: isPdf ? "pdf" : (isYouTube ? "youtube" : "video"), saved_at: new Date().toISOString() }, { merge: true });
        } catch (fbError) {}

        if (isPdf) { window.showFallbackState("This is a PDF document. Please click below to view.", "file-text", "PDF Document Ready", "Open PDF", finalUrl); return; }
        if (isYouTube) { initYouTubePlayer(finalUrl, title, isLive); return; }
        if (!lowerUrl.includes('.mp4') && !lowerUrl.includes('.m3u8') && !lowerUrl.includes('.mpd')) { window.showFallbackState("This format is not supported in the video player. Please open directly.", "external-link", "Content Ready", "Open Content", finalUrl); return; }
        
        const poster = (mediaData.thumbnail && mediaData.thumbnail.trim() !== "") ? mediaData.thumbnail : "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1200&q=80";
        if (lowerUrl.includes('.mpd') || hasDrmDetails) { initShakaPlayer(finalUrl, drmToken, title, poster, isLive); }
        else { initVideoPlayer(finalUrl, title, poster, isLive); }
    } catch(err) {
        console.error("Resolver Error:", err);
        const isFallbackVisible = !document.getElementById('fallback-state').classList.contains('hidden');
        if (!isFallbackVisible) { window.showToast("Server Error fetching video stream.", 'error'); setTimeout(goBack, 1500); }
    }
}

async function initShakaPlayer(manifestUri, token, title, poster, isLive) {
    showState('player-container');
    document.getElementById('video-title').innerText = title;
    if (isLive) { document.getElementById('live-badge').classList.remove('hidden'); document.getElementById('live-badge').classList.add('flex'); }
    document.getElementById('plyr-wrapper').classList.remove('hidden');
    document.getElementById('yt-player').classList.add('hidden');
    const video = document.getElementById('plyr-video');
    video.poster = poster;
    if (window.playerInstance) window.playerInstance.destroy();
    if (window.hlsInstance) window.hlsInstance.destroy();
    shaka.polyfill.installAll();
    
    if (!shaka.Player.isBrowserSupported()) { window.showFallbackState("Browser does not support Shaka Player DRM.", "alert-triangle", "DRM Error", "Go Back", "javascript:goBack()"); return; }
    window.shakaInstance = new shaka.Player(video);
    const config = { streaming: { bufferingGoal: 30, rebufferingGoal: 2, jumpLargeGaps: true } };
    
    if (token) {
        const licenseUrl = "https://license.videocrypt.com/validateLicense?pallyconCustomdataV2=" + encodeURIComponent(token);
        config.drm = { servers: { 'com.widevine.alpha': licenseUrl, 'com.microsoft.playready': licenseUrl } };
    }
    window.shakaInstance.configure(config);
    window.shakaInstance.addEventListener('error', (e) => { console.error("Shaka Error:", e); });
    
    try {
        await window.shakaInstance.load(manifestUri);
        window.playerInstance = new Plyr(video, { controls: ['play-large', 'rewind', 'play', 'fast-forward', 'progress', 'current-time', 'duration', 'mute', 'volume', 'fullscreen'], seekTime: 10, autoplay: true, keyboard: { focused: true, global: true } });
        setupCustomPlyr(window.playerInstance);
        const qualityContainer = document.getElementById('quality-controls');
        if (qualityContainer) qualityContainer.innerHTML = `<span class="text-slate-400 text-xs font-medium bg-themeBg px-3 py-1.5 rounded-lg border border-white/5">Auto Adaptive (DRM)</span>`;
    } catch (e) {
        console.error("DRM Load Error:", e);
        window.showFallbackState("License fetch failed or Invalid MPD stream.", "alert-triangle", "Stream Error", "Go Back", "javascript:goBack()");
    }
}

function getYouTubeID(url) {
    if (!url) return null;
    if (/^[a-zA-Z0-9_-]{11}$/.test(url)) return url;
    let match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=|live\/|shorts\/))([^?&#]+)/);
    return match ? match[1] : url;
}

function initYouTubePlayer(sourceUrl, title, isLive) {
    showState('player-container');
    document.getElementById('video-title').innerText = title;
    if (isLive) { document.getElementById('live-badge').classList.remove('hidden'); document.getElementById('live-badge').classList.add('flex'); }
    document.getElementById('plyr-wrapper').classList.add('hidden');
    const ytContainer = document.getElementById('yt-player');
    ytContainer.classList.remove('hidden');
    const ytId = getYouTubeID(sourceUrl);
    ytContainer.innerHTML = `<iframe src="https://www.youtube.com/embed/${ytId}?autoplay=1&rel=0&modestbranding=1&playsinline=1" class="w-full h-full" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>`;
}

function initVideoPlayer(sourceUrl, title, poster, isLive) {
    showState('player-container');
    document.getElementById('video-title').innerText = title;
    if (isLive) { document.getElementById('live-badge').classList.remove('hidden'); document.getElementById('live-badge').classList.add('flex'); }
    document.getElementById('plyr-wrapper').classList.remove('hidden');
    document.getElementById('yt-player').classList.add('hidden');
    const video = document.getElementById('plyr-video');
    video.poster = poster;
    if (window.playerInstance) { window.playerInstance.destroy(); }
    if (window.hlsInstance) { window.hlsInstance.destroy(); }
    if (window.shakaInstance) { window.shakaInstance.destroy(); }
    
    const defaultOptions = { controls: ['play-large', 'rewind', 'play', 'fast-forward', 'progress', 'current-time', 'duration', 'mute', 'volume', 'fullscreen'], seekTime: 10, autoplay: true, keyboard: { focused: true, global: true } };
    
    if (sourceUrl.includes('.m3u8') && Hls.isSupported()) {
        const hls = new Hls({ maxBufferLength: 60 });
        hls.loadSource(sourceUrl);
        hls.on(Hls.Events.MANIFEST_PARSED, function () {
            const qualityContainer = document.getElementById('quality-controls');
            if (qualityContainer) {
                let html = `<button onclick="setQuality(-1)" class="control-btn quality-btn active" data-val="-1">Auto</button>`;
                hls.levels.forEach((l, idx) => { html += `<button onclick="setQuality(${idx})" class="control-btn quality-btn" data-val="${idx}">${l.height}p</button>`; });
                qualityContainer.innerHTML = html;
            }
            window.playerInstance = new Plyr(video, defaultOptions);
            setupCustomPlyr(window.playerInstance);
        });
        hls.attachMedia(video);
        window.hlsInstance = hls;
    } else {
        video.src = sourceUrl;
        const qualityContainer = document.getElementById('quality-controls');
        if (qualityContainer) qualityContainer.innerHTML = `<span class="text-slate-400 text-xs font-medium bg-themeBg px-3 py-1.5 rounded-lg border border-white/5">Auto (Native)</span>`;
        window.playerInstance = new Plyr(video, defaultOptions);
        setupCustomPlyr(window.playerInstance);
    }
    lucide.createIcons();
}

function setupCustomPlyr(player) {
    player.on('ready', () => {
        const rewindBtn = document.querySelector('[data-plyr="rewind"]');
        if (rewindBtn) rewindBtn.innerHTML = `<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="custom-icon-svg" style="width:22px;height:22px;margin:auto;"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><text x="12" y="16.5" font-size="7" font-weight="900" font-family="sans-serif" class="custom-icon-text" text-anchor="middle">10</text></svg>`;
        const forwardBtn = document.querySelector('[data-plyr="fast-forward"]');
        if (forwardBtn) forwardBtn.innerHTML = `<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="custom-icon-svg" style="width:22px;height:22px;margin:auto;"><path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><text x="12" y="16.5" font-size="7" font-weight="900" font-family="sans-serif" class="custom-icon-text" text-anchor="middle">10</text></svg>`;
    });
    player.on('enterfullscreen', () => { try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{}); } catch (e) {} });
    player.on('exitfullscreen', () => { try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {} });
}

window.setQuality = function(index) {
    if(window.hlsInstance) {
        window.hlsInstance.currentLevel = index;
        document.querySelectorAll('.quality-btn').forEach(btn => { 
            if (parseInt(btn.dataset.val) === index) btn.classList.add('active'); 
            else btn.classList.remove('active'); 
        });
    }
};

window.setSpeed = function(speed) {
    if (window.playerInstance) window.playerInstance.speed = speed;
    const video = document.getElementById('plyr-video');
    if (video) video.playbackRate = speed;
    document.querySelectorAll('.speed-btn').forEach(btn => { 
        if (parseFloat(btn.dataset.val) === speed) btn.classList.add('active'); 
        else btn.classList.remove('active'); 
    });
};

window.toggleFullScreen = function() {
    const playerContainer = document.querySelector('.plyr') || document.getElementById('plyr-video');
    const videoEl = document.getElementById('plyr-video');
    if (!playerContainer) return;
    
    if (videoEl && typeof videoEl.webkitEnterFullscreen === 'function') { 
        videoEl.webkitEnterFullscreen(); return; 
    }
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (playerContainer.requestFullscreen) { 
            playerContainer.requestFullscreen().catch(() => { if (videoEl && videoEl.webkitEnterFullscreen) videoEl.webkitEnterFullscreen(); }); 
        }
        else if (playerContainer.webkitRequestFullscreen) { playerContainer.webkitRequestFullscreen(); }
        else if (playerContainer.msRequestFullscreen) { playerContainer.msRequestFullscreen(); }
    } else {
        if (document.exitFullscreen) { document.exitFullscreen(); }
        else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); }
    }
};

window.addEventListener('beforeunload', () => {
    if (window.playerInstance) { window.playerInstance.destroy(); }
    if (window.hlsInstance) { window.hlsInstance.destroy(); }
    if (window.shakaInstance) { window.shakaInstance.destroy(); }
});
</script>
