<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Study Ace 🎓 | Premium Batches</title>
    
    <!-- Updated Logo -->
    <link rel="icon" href="https://i.ibb.co/sprtw68N/IMG-5850.png" type="image/png">  
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Syne:wght@600;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        themeBg: '#0f172a', /* Premium Slate Dark Background */
                        cardBg: '#1e293b',  /* Lighter Slate for Cards */
                        themeBlue: '#38bdf8', /* Asmani / Sky Blue */
                        themeBlueHover: '#0ea5e9',
                        themeGreen: '#10B981',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        syne: ['Syne', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            background-color: #0f172a; 
            color: #f8fafc; 
            scroll-behavior: smooth; 
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        
        .btn-click-effect { transition: transform 0.1s ease-in-out; }
        .btn-click-effect:active { transform: scale(0.95); }
        
        /* Clean, professional card styling with Sky Blue hover */
        .premium-card {
            background-color: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease-in-out;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .premium-card:hover {
            transform: translateY(-5px);
            border-color: rgba(56, 189, 248, 0.4);
            box-shadow: 0 12px 40px -10px rgba(56, 189, 248, 0.15);
        }
        
        .fade-in-pop { 
            animation: fadeInPop 0.5s ease-out forwards; 
            opacity: 0;
        }
        @keyframes fadeInPop { 
            0% { opacity: 0; transform: translateY(20px); } 
            100% { opacity: 1; transform: translateY(0); } 
        }
        
        @keyframes slideDown { from { transform: translate(-50%, -100%); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
        .toast-enter { animation: slideDown 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        
        .nav-glass {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .modal-glass {
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="min-h-screen relative flex flex-col font-sans pb-12">
    
    <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 z-[999] hidden items-center gap-3 px-6 py-3 rounded-full font-bold text-sm shadow-[0_10px_30px_rgba(0,0,0,0.5)] border transition-all duration-300">
        <i data-lucide="info" id="toast-icon" class="w-4 h-4"></i>
        <span id="toast-msg">Notification</span>
    </div>

    <!-- Navbar -->
    <nav class="w-full z-40 nav-glass h-[70px] sticky top-0">
        <div class="max-w-[90rem] mx-auto px-4 sm:px-6 h-full flex items-center justify-between">
            <div class="flex items-center gap-3 cursor-pointer btn-click-effect" onclick="window.location.reload()">
                <div class="w-9 h-9 bg-white border border-white/20 rounded-lg flex items-center justify-center relative z-10 overflow-hidden shadow-lg shadow-themeBlue/20">
                    <!-- Updated Logo Here -->
                    <img src="https://i.ibb.co/sprtw68N/IMG-5850.png" alt="Study Ace Logo" class="w-full h-full object-contain p-0.5">
                </div>
                <!-- Updated Brand Name -->
                <h1 class="text-xl font-black tracking-wider text-white font-syne">STUDY<span class="text-themeBlue">ACE</span></h1>
            </div>
            
            <div class="hidden md:flex items-center gap-6">
                <button onclick="switchTab('new')" class="text-white hover:text-themeBlue font-bold text-sm transition-colors flex items-center gap-2 btn-click-effect">
                    <i data-lucide="layout-grid" class="w-4 h-4"></i> Batches
                </button>
                <button onclick="switchTab('wishlist')" class="text-slate-400 hover:text-white font-bold text-sm transition-colors flex items-center gap-2">
                    <i data-lucide="bookmark" class="w-4 h-4"></i> My Enrollments
                </button>
            </div>
            
            <div class="md:hidden flex items-center gap-3">
                <button onclick="switchTab('wishlist')" class="text-slate-300 p-2 border border-white/10 rounded-lg hover:text-themeBlue hover:border-themeBlue transition-colors btn-click-effect relative bg-white/5">
                    <i data-lucide="bookmark" class="w-5 h-5"></i>
                    <span id="mobile-wishlist-indicator" class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-themeBlue rounded-full hidden shadow-[0_0_8px_rgba(56,189,248,0.8)]"></span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 w-full max-w-[90rem] mx-auto px-4 sm:px-6 pt-8 relative z-10">
        
        <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4 mb-8 fade-in-pop" style="animation-delay: 50ms;">
            
            <!-- Tabs Navigation -->
            <div class="flex items-center gap-1 sm:gap-2 overflow-x-auto hide-scroll w-full md:w-auto p-1 bg-slate-800 rounded-xl border border-white/10 shadow-inner">
                
                <button id="tab-new" onclick="switchTab('new')" class="tab-btn active shrink-0 px-3 sm:px-5 py-1.5 sm:py-2 rounded-lg text-[11px] sm:text-sm font-bold transition-all bg-themeBlue/20 text-themeBlue border border-themeBlue/30 flex items-center gap-1.5 shadow-sm">
                    <i data-lucide="sparkles" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i> 
                    Latest <span class="hidden sm:inline">Batches</span>
                </button>
                
                <button id="tab-wishlist" onclick="switchTab('wishlist')" class="tab-btn shrink-0 px-3 sm:px-5 py-1.5 sm:py-2 rounded-lg text-[11px] sm:text-sm font-bold transition-all bg-transparent text-slate-400 hover:text-slate-200 border border-transparent flex items-center gap-1.5">
                    <i data-lucide="bookmark" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i> 
                    <span class="hidden sm:inline">My </span>Enrolled
                    <span id="wishlist-count" class="bg-themeBlue text-slate-900 text-[9px] sm:text-[10px] font-black px-1.5 py-0.5 rounded hidden">0</span>
                </button>
                
                <div class="w-px h-4 bg-white/10 mx-1 shrink-0"></div>
                
                <button onclick="window.location.href='https://old-nt.studyace.in'" class="shrink-0 px-3 sm:px-5 py-1.5 sm:py-2 rounded-lg text-[11px] sm:text-sm font-bold transition-all bg-transparent text-slate-400 hover:text-themeBlue border border-transparent flex items-center gap-1.5 btn-click-effect">
                    <i data-lucide="history" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i> 
                    Old <span class="hidden sm:inline">Batches</span>
                    <i data-lucide="external-link" class="w-3 h-3 opacity-60"></i>
                </button>

            </div>
            
            <!-- Search Box -->
            <div class="relative w-full md:w-[350px]">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                    <i data-lucide="search" class="w-4 h-4 text-slate-400"></i>
                </div>
                <input type="text" id="searchInput" placeholder="Search batches..." 
                    class="w-full bg-slate-800 border border-white/10 text-white text-sm rounded-xl block pl-10 pr-10 py-2.5 transition-all placeholder:text-slate-500 focus:outline-none focus:border-themeBlue/50 focus:ring-1 focus:ring-themeBlue/50">
                <button id="clearSearchBtn" onclick="clearSearch()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-white hidden transition-colors">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
        
        <div id="loadingIndicator" class="flex flex-col items-center justify-center py-20">
            <i data-lucide="loader-2" class="w-8 h-8 animate-spin text-themeBlue mb-3"></i>
            <p class="text-slate-400 font-medium text-sm">Loading batches...</p>
        </div>
        
        <div id="batchGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 hidden">
        </div>
        
        <div id="loadMoreContainer" class="w-full flex justify-center mt-10 mb-6 hidden fade-in-pop">
            <button id="loadMoreBtn" onclick="loadMore()" class="px-8 py-2.5 bg-slate-800 border border-white/10 hover:border-themeBlue/40 rounded-lg text-white font-semibold text-sm transition-all btn-click-effect flex items-center gap-2 hover:shadow-[0_0_15px_rgba(56,189,248,0.15)]">
                Load More <i data-lucide="chevron-down" class="w-4 h-4"></i>
            </button>
        </div>
        
        <div id="emptyState" class="hidden flex-col items-center justify-center py-20 text-center fade-in-pop">
            <div class="w-16 h-16 bg-white/5 rounded-full flex items-center justify-center mb-4 border border-white/10">
                <i data-lucide="folder-open" class="w-8 h-8 text-slate-500"></i>
            </div>
            <h3 class="text-xl font-bold text-white mb-1">No Batches Found</h3>
            <p class="text-slate-400 text-sm">Try adjusting your search or enrolling in new batches.</p>
        </div>
    </main>

    <script>
        lucide.createIcons();

        window.showToast = function(msg, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            toast.className = `fixed top-6 left-1/2 -translate-x-1/2 z-[999] flex items-center gap-2.5 px-4 py-2.5 rounded-lg font-medium text-sm border toast-enter`;
            
            if (type === 'success') {
                toast.classList.add('bg-sky-950/90', 'border-sky-800', 'text-sky-400');
                icon.setAttribute('data-lucide', 'check-circle-2');
            } else {
                toast.classList.add('bg-red-950/90', 'border-red-800', 'text-red-400');
                icon.setAttribute('data-lucide', 'alert-circle');
            }
            
            document.getElementById('toast-msg').innerText = msg;
            lucide.createIcons();
            
            setTimeout(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('hidden');
            }, 3000);
        };

        window.handleStudyClick = function(event, batchId) {
            event.preventDefault();
            window.location.href = `content.html?id=${batchId}`;
        };

        let batchesData = { new: [] };
        let currentTab = 'new';
        
        // Updated local storage key for new branding
        let wishlist = JSON.parse(localStorage.getItem('studyace_wishlist') || localStorage.getItem('studybee_wishlist') || '[]').map(String);

        const ITEMS_PER_PAGE = 12;
        let currentlyDisplayedCount = 0;
        let currentFilteredData = [];

        const batchGrid = document.getElementById('batchGrid');
        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearchBtn');
        const emptyState = document.getElementById('emptyState');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const loadMoreContainer = document.getElementById('loadMoreContainer');

        document.addEventListener('DOMContentLoaded', () => {
            updateWishlistCount();
            fetchBatches();
        });

        async function fetchBatches() {
            try {
                const response = await fetch('batches.json');
                if (!response.ok) throw new Error("Failed to load JSON");
                const rawData = await response.json();
                
                batchesData.new = [...(rawData.new || []), ...(rawData.old || [])];
                
                loadingIndicator.classList.add('hidden');
                batchGrid.classList.remove('hidden');
                applyFiltersAndRender(true);
            } catch (error) {
                console.error("Error fetching batches:", error);
                loadingIndicator.innerHTML = `
                    <div class="text-center py-10">
                        <i data-lucide="alert-circle" class="w-8 h-8 text-slate-500 mx-auto mb-2"></i>
                        <p class="text-slate-400 font-medium text-sm">Failed to load batches</p>
                    </div>`;
                lucide.createIcons();
            }
        }

        searchInput.addEventListener('input', () => {
            if (searchInput.value.length > 0) {
                clearSearchBtn.classList.remove('hidden');
            } else {
                clearSearchBtn.classList.add('hidden');
            }
            applyFiltersAndRender(true);
        });

        function clearSearch() {
            searchInput.value = '';
            clearSearchBtn.classList.add('hidden');
            applyFiltersAndRender(true);
            searchInput.focus();
        }

        window.switchTab = function(tabName) {
            currentTab = tabName;
            searchInput.value = '';
            clearSearchBtn.classList.add('hidden');
            
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-themeBlue/20', 'text-themeBlue', 'border-themeBlue/30');
                btn.classList.add('bg-transparent', 'text-slate-400', 'border-transparent');
            });
            
            const activeTab = document.getElementById(`tab-${tabName}`);
            activeTab.classList.remove('bg-transparent', 'text-slate-400', 'border-transparent');
            activeTab.classList.add('bg-themeBlue/20', 'text-themeBlue', 'border-themeBlue/30');
            applyFiltersAndRender(true);
        };

        function applyFiltersAndRender(resetPagination = false) {
            const query = searchInput.value.toLowerCase().trim();
            
            if (currentTab === 'wishlist') {
                const allBatches = batchesData.new;
                const uniqueBatches = Array.from(new Map(allBatches.map(item => [String(item.id), item])).values());
                currentFilteredData = uniqueBatches.filter(batch => wishlist.includes(String(batch.id)));
            } else {
                currentFilteredData = batchesData[currentTab] || [];
            }

            if (query) {
                currentFilteredData = currentFilteredData.filter(batch => {
                    return batch.title.toLowerCase().includes(query) || String(batch.id).includes(query);
                });
            }

            if (resetPagination) {
                currentlyDisplayedCount = 0;
                batchGrid.innerHTML = '';
            }

            renderBatchSlice();
        }

        function renderBatchSlice() {
            if (currentFilteredData.length === 0) {
                batchGrid.classList.add('hidden');
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                loadMoreContainer.classList.add('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            emptyState.classList.remove('flex');
            batchGrid.classList.remove('hidden');

            const nextCount = Math.min(currentlyDisplayedCount + ITEMS_PER_PAGE, currentFilteredData.length);
            const itemsToRender = currentFilteredData.slice(currentlyDisplayedCount, nextCount);
            
            const html = itemsToRender.map((batch, index) => createCardHTML(batch, index)).join('');
            
            if (currentlyDisplayedCount === 0) {
                batchGrid.innerHTML = html;
            } else {
                batchGrid.insertAdjacentHTML('beforeend', html);
            }

            currentlyDisplayedCount = nextCount;
            lucide.createIcons();

            if (currentlyDisplayedCount < currentFilteredData.length) {
                loadMoreContainer.classList.remove('hidden');
            } else {
                loadMoreContainer.classList.add('hidden');
            }
        }

        window.loadMore = function() {
            const btn = document.getElementById('loadMoreBtn');
            if (btn.disabled) return; 
            
            const originalHtml = btn.innerHTML;
            btn.disabled = true;
            
            btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin text-themeBlue"></i> Loading`;
            lucide.createIcons();
            
            setTimeout(() => {
                renderBatchSlice();
                btn.innerHTML = originalHtml;
                btn.disabled = false;
                lucide.createIcons();
            }, 300);
        };

        function createCardHTML(batch, index) {
            const id = String(batch.id);
            const isEnrolled = wishlist.includes(id);
            const delay = (index % ITEMS_PER_PAGE * 30) + 'ms';
            
            const enrollBtnState = isEnrolled 
                ? `<button onclick="toggleEnroll(event, '${id}')" class="bg-themeBlue/10 text-themeBlue border border-themeBlue/20 px-3 py-1.5 rounded text-[11px] font-bold tracking-wider flex items-center gap-1.5 hover:bg-themeBlue/20 transition-colors"><i data-lucide="check" class="w-3.5 h-3.5"></i> ENROLLED</button>`
                : `<button onclick="toggleEnroll(event, '${id}')" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded text-[11px] font-bold tracking-wider flex items-center gap-1.5 transition-colors btn-click-effect shadow-md border border-white/5"><i data-lucide="plus" class="w-3.5 h-3.5"></i> ENROLL</button>`;

            return `
                <div class="premium-card rounded-xl overflow-hidden fade-in-pop group flex flex-col relative" style="animation-delay: ${delay}">
                    <div class="relative w-full aspect-[16/9] overflow-hidden bg-slate-900 border-b border-white/5">
                        <img src="${batch.thumbnail}" alt="${batch.title}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 opacity-90 group-hover:opacity-100">
                        
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-transparent to-transparent opacity-90"></div>
                        
                        <div class="absolute top-3 right-3 bg-themeBlue/20 backdrop-blur-md border border-themeBlue/30 px-2 py-1 rounded flex items-center justify-center z-10 shadow-sm">
                            <span class="text-themeBlue text-[10px] font-black tracking-widest uppercase">FREE</span>
                        </div>
                    </div>
                    
                    <div class="p-5 flex flex-col flex-1 relative z-20">
                        <h3 class="text-slate-200 font-semibold text-sm leading-relaxed mb-4 line-clamp-2 group-hover:text-themeBlue transition-colors">${batch.title}</h3>
                        
                        <div class="flex items-center justify-between mt-auto pt-4 border-t border-white/10">
                            <div id="enroll-container-${id}">
                                ${enrollBtnState}
                            </div>
                            
                            <button onclick="handleStudyClick(event, '${id}')" class="bg-themeBlue hover:bg-themeBlueHover text-slate-900 px-4 py-2 rounded text-[11px] font-bold uppercase tracking-wider flex items-center gap-1.5 transition-colors btn-click-effect shadow-[0_0_15px_rgba(56,189,248,0.3)]">
                                Let's Study <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        window.toggleEnroll = function(event, batchId) {
            event.stopPropagation();
            batchId = String(batchId);
            
            const index = wishlist.indexOf(batchId);
            const container = document.getElementById(`enroll-container-${batchId}`);
            
            if (index === -1) {
                wishlist.push(batchId);
                showToast("Enrolled in batch!", "success");
                if (container) {
                    container.innerHTML = `<button onclick="toggleEnroll(event, '${batchId}')" class="bg-themeBlue/10 text-themeBlue border border-themeBlue/20 px-3 py-1.5 rounded text-[11px] font-bold tracking-wider flex items-center gap-1.5 hover:bg-themeBlue/20 transition-colors"><i data-lucide="check" class="w-3.5 h-3.5"></i> ENROLLED</button>`;
                }
            } else {
                wishlist.splice(index, 1);
                if (container) {
                    container.innerHTML = `<button onclick="toggleEnroll(event, '${batchId}')" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded text-[11px] font-bold tracking-wider flex items-center gap-1.5 transition-colors btn-click-effect shadow-md border border-white/5"><i data-lucide="plus" class="w-3.5 h-3.5"></i> ENROLL</button>`;
                }
                
                if (currentTab === 'wishlist') {
                    applyFiltersAndRender(true);
                }
            }

            localStorage.setItem('studyace_wishlist', JSON.stringify(wishlist));
            updateWishlistCount();
            lucide.createIcons();
        };

        function updateWishlistCount() {
            const countEl = document.getElementById('wishlist-count');
            const mobileIndicator = document.getElementById('mobile-wishlist-indicator');
            
            if (wishlist.length > 0) {
                countEl.innerText = wishlist.length;
                countEl.classList.remove('hidden');
                mobileIndicator.classList.remove('hidden');
            } else {
                countEl.classList.add('hidden');
                mobileIndicator.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
